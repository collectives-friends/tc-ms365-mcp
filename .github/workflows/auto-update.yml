name: auto-update
on:
  schedule:
    - cron: "23 4 * * 1" # mandag 04:23 UTC
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Merge upstream (Softeria) into PR branch
        id: merge
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          set -euo pipefail
          git config user.name "auto-update"
          git config user.email "auto-update@users.noreply.github.com"
          git remote add upstream https://github.com/Softeria/ms-365-mcp-server.git
          git fetch upstream main
          BRANCH="auto-update/upstream-$(date -u +%Y%m%d)"
          git checkout -B "$BRANCH"
          BEFORE=$(git rev-parse HEAD)
          if git merge --no-edit upstream/main; then
            AFTER=$(git rev-parse HEAD)
            if [ "$BEFORE" = "$AFTER" ]; then
              echo "status=noop" >> "$GITHUB_OUTPUT"
              echo "Ingen nye upstream-commits."
              exit 0
            fi
            git push -u origin "$BRANCH"
            gh pr create --title "chore: sync upstream Softeria/ms-365-mcp-server" \
              --body "Automatisk upstream-merge. Review Infisical/Dockerfile TC-ændringer før merge." \
              --base main --head "$BRANCH" || true
            echo "status=pr" >> "$GITHUB_OUTPUT"
          else
            git merge --abort || true
            echo "::notice::Upstream merge-konflikt (Softeria). TC-fork divergerer (Infisical/codegen). Manuel sync kræves."
            echo "status=conflict" >> "$GITHUB_OUTPUT"
            exit 0
          fi
