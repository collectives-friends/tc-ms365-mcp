name: docker-publish
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
jobs:
  gate:
    # event == push udelukker PR'er fra forks, hvis head-branch også hedder main.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      # ponytail: ser kun på sidste commit; holder, fordi main kun får squash/merge via PR.
      - id: paths
        run: |
          files=$(git diff --name-only HEAD^ HEAD -- Dockerfile src 'package*.json')
          echo "changed=$([ -n "$files" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
  build-push:
    needs: gate
    if: needs.gate.outputs.changed == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/collectives-friends/tc-ms365-mcp:latest
      - name: Trigger Sliplane redeploy
        env: { HOOK: "${{ secrets.SLIPLANE_DEPLOY_HOOK }}" }
        run: '[ -n "$HOOK" ] && curl -fsS "$HOOK" && echo redeploy-ok || echo "no hook secret set"'
      - name: Wait for rollout
        run: sleep 50
      - name: Smoke test
        run: |
          BASE=https://ms365-mcp-server.sliplane.app
          c=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/.well-known/oauth-authorization-server")
          echo "discovery=$c"; test "$c" = "200"
