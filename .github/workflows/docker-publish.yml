name: docker-publish
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
jobs:
  gate:
    # event == push udelukker PR'er fra forks, hvis head-branch også hedder main.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      # ponytail: ser kun på sidste commit; rebase-merge kan skjule kildeændringer, så slå det fra eller diff hele pushet.
      - id: paths
        run: |
          files=$(git diff --name-only HEAD^ HEAD -- Dockerfile src bin tsconfig.json tsup.config.ts 'package*.json')
          echo "changed=$([ -n "$files" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
  build-push:
    needs: gate
    if: needs.gate.outputs.changed == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/collectives-friends/tc-ms365-mcp:latest
  # Uafhængig af stifilteret: branchen følger hvert grønt commit, og Sliplanes include paths afgør, om der deployes.
  advance-release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.repository == 'collectives-friends/tc-ms365-mcp'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    concurrency:
      group: release-production
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Fast-forward release/production to the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          head=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
          if [ "$head" != "$SHA" ]; then
            echo "::notice::Springer over: $SHA er ikke længere nyeste commit på main ($head)."
            exit 0
          fi
          if gh api "repos/$REPO/git/ref/heads/release/production" >/dev/null 2>&1; then
            # force=false: GitHub afviser alt andet end fast-forward, så en ældre kørsel ikke kan spole tilbage.
            gh api -X PATCH "repos/$REPO/git/refs/heads/release/production" -f sha="$SHA" -F force=false >/dev/null
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref=refs/heads/release/production -f sha="$SHA" >/dev/null
          fi
          echo "release/production -> $SHA"
